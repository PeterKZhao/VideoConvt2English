name: Secret organization migration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SECRET_MIGRATION_GITHUB_TOKEN }}
      SOURCE_YOUTUBE_COOKIE: ${{ secrets.YTDLP_COOKIES }}
    steps:
      - name: Migrate source credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test -n "$SOURCE_YOUTUBE_COOKIE"

          gh secret set YOUTUBE_SOURCE_COOKIE_FILE_VIDEO_DUB \
            --org Business-Unit-for-Video \
            --repos VideoConvt2English \
            --body "$SOURCE_YOUTUBE_COOKIE"
