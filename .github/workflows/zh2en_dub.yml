name: CN video -> EN dubbed video (voice clone, artifact)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Video URL to download (e.g., YouTube)"
        required: true
      agree_cpml:
        description: "Type 'yes' to agree to Coqui CPML (non-commercial only)"
        required: true
        default: "yes"
      whisper_model:
        description: "Whisper model: tiny/base/small/medium/large"
        required: false
        default: "small"
      tts_ref_seconds:
        description: "Seconds used as voice reference (>=10 recommended)"
        required: false
        default: "15"
      retention_days:
        description: "Artifact retention days (1-90)"
        required: false
        default: "7"

permissions:
  contents: read

jobs:
  dub:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Check CPML agreement
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.agree_cpml }}" != "yes" ]; then
            echo "You must set agree_cpml=yes to proceed. CPML is non-commercial only: https://coqui.ai/cpml.txt"
            exit 1
          fi

      - name: Setup Node (yt-dlp JS runtime)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python deps (pin transformers for XTTS)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip

          # IMPORTANT: pin transformers==4.40.2 (XTTS expects BeamSearchScorer)
          pip install --no-cache-dir \
            yt-dlp yt-dlp-ejs openai-whisper TTS \
            "transformers==4.40.2"

          python - <<'PY'
          import transformers
          from transformers import BeamSearchScorer
          print("transformers =", transformers.__version__)
          print("BeamSearchScorer import OK")
          PY

      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out
          mkdir -p out

      - name: Set TTS_HOME (Coqui cache dir) + non-interactive CPML agree
        shell: bash
        run: |
          set -euo pipefail
          echo "TTS_HOME=$RUNNER_TEMP/coqui-tts-home" >> "$GITHUB_ENV"
          echo "COQUI_TOS_AGREED=1" >> "$GITHUB_ENV"

      - name: Write cookies.txt (optional)
        shell: bash
        env:
          YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
        run: |
          python - <<'PY'
          import os, pathlib
          content = os.environ.get("YTDLP_COOKIES", "")
          if content.strip():
            pathlib.Path("cookies.txt").write_text(content, encoding="utf-8", newline="\n")
            print("cookies.txt written")
          else:
            print("No cookies secret provided; skipping cookies.txt")
          PY

      - name: Download video (yt-dlp)
        shell: bash
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          set -euo pipefail
          EXTRA_ARGS=()
          if [ -f cookies.txt ]; then
            EXTRA_ARGS+=(--cookies cookies.txt)
          fi
          EXTRA_ARGS+=(--js-runtimes node)
          EXTRA_ARGS+=(--remote-components ejs:github)

          FORMAT_SELECTOR='bv*[vcodec^=avc1][ext=mp4]+ba[ext=m4a]/b[ext=mp4]/best'

          yt-dlp \
            "${EXTRA_ARGS[@]}" \
            --no-playlist \
            -f "$FORMAT_SELECTOR" \
            --merge-output-format mp4 \
            -o "out/input.%(ext)s" \
            "$VIDEO_URL"

          ls -lah out

      - name: Extract audio for Whisper (16k mono wav)
        shell: bash
        run: |
          set -euo pipefail
          VIDEO_FILE="$(ls -1 out/input.* | head -n 1)"
          ffmpeg -y -i "$VIDEO_FILE" -vn -ac 1 -ar 16000 -c:a pcm_s16le out/_whisper.wav

      - name: Make voice reference wav (for cloning)
        shell: bash
        env:
          REF_SEC: ${{ inputs.tts_ref_seconds }}
        run: |
          set -euo pipefail
          VIDEO_FILE="$(ls -1 out/input.* | head -n 1)"
          ffmpeg -y -ss 1 -t "$REF_SEC" -i "$VIDEO_FILE" -vn -ac 1 -ar 24000 -c:a pcm_s16le out/_ref.wav

      - name: Whisper translate to English text (txt)
        shell: bash
        env:
          WHISPER_MODEL: ${{ inputs.whisper_model }}
        run: |
          set -euo pipefail
          whisper out/_whisper.wav \
            --model "$WHISPER_MODEL" \
            --task translate \
            --language Chinese \
            --output_dir out \
            --output_format txt

          test -s out/_whisper.txt

      - name: XTTS v2 voice-clone English audio (wav) with retry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, shutil, time
          from pathlib import Path

          text = Path("out/_whisper.txt").read_text(encoding="utf-8").strip()
          if not text:
              raise SystemExit("Empty transcript")

          tts_home = os.environ.get("TTS_HOME")
          if not tts_home:
              raise SystemExit("TTS_HOME not set")

          def wipe_cache():
              shutil.rmtree(tts_home, ignore_errors=True)

          for attempt in (1, 2):
              try:
                  from TTS.api import TTS
                  tts = TTS("tts_models/multilingual/multi-dataset/xtts_v2", gpu=False)
                  tts.tts_to_file(
                      text=text,
                      speaker_wav="out/_ref.wav",
                      language="en",
                      file_path="out/_en_cloned.wav",
                      split_sentences=True,
                  )
                  print("Generated out/_en_cloned.wav")
                  break
              except Exception as e:
                  print(f"XTTS failed on attempt {attempt}: {type(e).__name__}: {e}")
                  if attempt == 2:
                      raise
                  print("Wiping Coqui cache and retrying after 20s...")
                  wipe_cache()
                  time.sleep(20)
          PY

      - name: Mux into MP4 (Windows compatible)
        shell: bash
        run: |
          set -euo pipefail
          VIDEO_FILE="$(ls -1 out/input.* | head -n 1)"

          ffmpeg -y \
            -i "$VIDEO_FILE" -i out/_en_cloned.wav \
            -map 0:v:0 -map 1:a:0 \
            -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p \
            -c:a aac -b:a 192k \
            -shortest -movflags +faststart \
            out/output_en.mp4

      - name: Cleanup (keep only input.mp4 and output_en.mp4)
        shell: bash
        run: |
          set -euo pipefail
          IN="$(ls -1 out/input.* | head -n 1)"
          if [ "$IN" != "out/input.mp4" ]; then
            mv "$IN" out/input.mp4
          fi
          find out -type f ! -name "input.mp4" ! -name "output_en.mp4" -delete
          ls -lah out

      - name: Upload artifact (only 2 videos)
        uses: actions/upload-artifact@v4
        with:
          name: en-dubbed-output
          path: |
            out/input.mp4
            out/output_en.mp4
          retention-days: ${{ inputs.retention_days }}
