name: CN video -> EN dubbed video (voice clone, artifact)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Video URL to download (e.g., YouTube)"
        required: true
      agree_cpml:
        description: "Type 'yes' to agree to Coqui CPML (non-commercial only)"
        required: true
        default: "yes"
      whisper_model:
        description: "Whisper model: tiny/base/small/medium/large"
        required: false
        default: "small"
      tts_ref_seconds:
        description: "Seconds used as voice reference (>=10 recommended)"
        required: false
        default: "30"
      burn_subs:
        description: "Burn English subtitles into video? yes/no (default: no, means soft-subs embedded)"
        required: false
        default: "no"
      retention_days:
        description: "Artifact retention days (1-90)"
        required: false
        default: "7"

permissions:
  contents: read

jobs:
  dub:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Check CPML agreement
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.agree_cpml }}" != "yes" ]; then
            echo "You must set agree_cpml=yes to proceed. CPML is non-commercial only: https://coqui.ai/cpml.txt"
            exit 1
          fi

      - name: Setup Node (yt-dlp JS runtime)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python deps (pin torch + transformers)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip

          # Pin to avoid:
          # - transformers API breaks (BeamSearchScorer)
          # - torch 2.6+ weights_only behavior breaking XTTS checkpoint load
          pip install --no-cache-dir \
            "torch==2.5.1" "torchaudio==2.5.1" \
            "transformers==4.40.2" \
            yt-dlp yt-dlp-ejs openai-whisper TTS

          python - <<'PY'
          import torch, transformers
          print("torch =", torch.__version__)
          print("transformers =", transformers.__version__)
          PY

      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out
          mkdir -p out

      - name: Set TTS_HOME + non-interactive CPML agree
        shell: bash
        run: |
          set -euo pipefail
          echo "TTS_HOME=$RUNNER_TEMP/coqui-tts-home" >> "$GITHUB_ENV"
          echo "COQUI_TOS_AGREED=${COQUI_TOS_AGREED:-1}" >> "$GITHUB_ENV"
        env:
          COQUI_TOS_AGREED: ${{ vars.COQUI_TOS_AGREED }}

      - name: Write cookies.txt (optional)
        shell: bash
        env:
          YTDLP_COOKIES: ${{ secrets.YOUTUBE_SOURCE_COOKIE_FILE_VIDEO_DUB }}
        run: |
          python - <<'PY'
          import os, pathlib
          content = os.environ.get("YTDLP_COOKIES", "")
          if content.strip():
            pathlib.Path("cookies.txt").write_text(content, encoding="utf-8", newline="\n")
            print("cookies.txt written")
          else:
            print("No cookies secret provided; skipping cookies.txt")
          PY

      - name: Download video + subtitles if available (yt-dlp)
        shell: bash
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          set -euo pipefail
          EXTRA_ARGS=()
          if [ -f cookies.txt ]; then
            EXTRA_ARGS+=(--cookies cookies.txt)
          fi
          EXTRA_ARGS+=(--js-runtimes node)
          EXTRA_ARGS+=(--remote-components ejs:github)

          FORMAT_SELECTOR='bv*[vcodec^=avc1][ext=mp4]+ba[ext=m4a]/b[ext=mp4]/best'

          yt-dlp \
            "${EXTRA_ARGS[@]}" \
            --no-playlist \
            -f "$FORMAT_SELECTOR" \
            --merge-output-format mp4 \
            -o "out/input.%(ext)s" \
            --write-subs \
            --write-auto-subs \
            --sub-langs "zh.*,en.*" \
            --sub-format "vtt/ttml/best" \
            --convert-subs srt \
            "$VIDEO_URL"

          ls -lah out

      - name: Normalize video filename to out/input.mp4
        shell: bash
        run: |
          set -euo pipefail

          if [ -s out/input.mp4 ]; then
            echo "Found out/input.mp4"
            exit 0
          fi

          # Find first likely video file; avoid subtitles / text sidecars.
          VID="$(ls -1 out/input.* 2>/dev/null | grep -E '\.(mp4|mkv|webm|mov)$' | head -n 1 || true)"
          if [ -z "${VID}" ]; then
            echo "ERROR: Cannot find downloaded video (out/input.* with video extension)."
            ls -lah out
            exit 1
          fi

          mv -f "$VID" out/input.mp4
          echo "Normalized video to out/input.mp4"
          ls -lah out

      - name: Extract embedded subtitle track (best-effort, if no SRT sidecar)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess, pathlib

          out_dir = pathlib.Path("out")
          existing = sorted(out_dir.glob("input*.srt"))
          if existing:
              print("SRT sidecars already present:", [p.name for p in existing])
              raise SystemExit(0)

          # Probe subtitle streams (if any)
          cmd = [
              "ffprobe", "-v", "error",
              "-select_streams", "s",
              "-show_entries", "stream_tags=language",
              "-of", "json",
              "out/input.mp4",
          ]
          p = subprocess.run(cmd, capture_output=True, text=True)
          if p.returncode != 0:
              print("ffprobe failed; skipping embedded subtitle extraction")
              raise SystemExit(0)

          data = json.loads(p.stdout or "{}")
          streams = data.get("streams", []) or []
          if not streams:
              print("No embedded subtitle streams found.")
              raise SystemExit(0)

          def score(stream):
              lang = ((stream.get("tags") or {}).get("language") or "").lower()
              if lang.startswith("zh"): return 0
              if lang.startswith("en"): return 1
              return 2

          best_i = sorted(range(len(streams)), key=lambda i: score(streams[i]))[0]
          best_lang = (((streams[best_i].get("tags") or {}).get("language")) or "und").lower()
          lang_slug = "zh" if best_lang.startswith("zh") else ("en" if best_lang.startswith("en") else "emb")
          out_srt = out_dir / f"input.{lang_slug}.srt"

          # Try to convert that subtitle stream to SRT (may fail for image-based subs like PGS)
          cmd2 = [
              "ffmpeg", "-y",
              "-i", "out/input.mp4",
              "-map", f"0:s:{best_i}",
              "-c:s", "srt",
              str(out_srt),
          ]
          p2 = subprocess.run(cmd2, capture_output=True, text=True)

          if p2.returncode != 0 or (not out_srt.exists()) or out_srt.stat().st_size == 0:
              if out_srt.exists():
                  out_srt.unlink()
              print("Embedded subtitle extraction failed (possibly image-based subtitles).")
          else:
              print("Extracted embedded subtitles to", out_srt.name)
          PY

      - name: Detect downloaded subtitles and make transcripts (prefer existing)
        id: detect_subs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re, pathlib

          out_dir = pathlib.Path("out")
          srt_files = sorted(out_dir.glob("input*.srt"))

          def pick_lang(files, prefixes):
              scored = []
              for p in files:
                  name = p.name.lower()
                  for i, pref in enumerate(prefixes):
                      pref = pref.lower()
                      if re.search(rf"\.{re.escape(pref)}([.\-]|$)", name):
                          scored.append((i, len(name), p))
                          break
              if not scored:
                  for p in files:
                      name = p.name.lower()
                      for i, pref in enumerate(prefixes):
                          pref = pref.lower()
                          if f".{pref}" in name:
                              scored.append((i, len(name), p))
                              break
              if not scored:
                  return None
              scored.sort()
              return scored[0][2]

          def srt_to_text(srt_path: pathlib.Path) -> str:
              text_lines = []
              for raw in srt_path.read_text(encoding="utf-8", errors="ignore").splitlines():
                  line = raw.strip()
                  if not line:
                      continue
                  if re.fullmatch(r"\d+", line):
                      continue
                  if "-->" in line:
                      continue
                  line = re.sub(r"<[^>]+>", "", line)
                  line = line.strip()
                  if line:
                      text_lines.append(line)
              return "\n".join(text_lines).strip()

          zh_prefixes = ["zh-hans", "zh-cn", "zh", "zh-hant", "zh-tw", "cmn"]
          en_prefixes = ["en-us", "en-gb", "en", "eng"]

          zh_srt = pick_lang(srt_files, zh_prefixes)
          en_srt = pick_lang(srt_files, en_prefixes)

          have_zh = False
          have_en = False

          if zh_srt and zh_srt.exists() and zh_srt.stat().st_size > 0:
              (out_dir / "sub_zh.srt").write_text(zh_srt.read_text(encoding="utf-8", errors="ignore"), encoding="utf-8")
              (out_dir / "transcript_zh.txt").write_text(srt_to_text(zh_srt), encoding="utf-8")
              have_zh = True

          if en_srt and en_srt.exists() and en_srt.stat().st_size > 0:
              (out_dir / "sub_en.srt").write_text(en_srt.read_text(encoding="utf-8", errors="ignore"), encoding="utf-8")
              (out_dir / "transcript_en.txt").write_text(srt_to_text(en_srt), encoding="utf-8")
              have_en = True

          gh_out = os.environ.get("GITHUB_OUTPUT")
          if gh_out:
              with open(gh_out, "a", encoding="utf-8") as f:
                  f.write(f"have_zh={'true' if have_zh else 'false'}\n")
                  f.write(f"have_en={'true' if have_en else 'false'}\n")

          print("Found SRTs:", [p.name for p in srt_files])
          print("have_zh =", have_zh, "picked:", zh_srt.name if zh_srt else None)
          print("have_en =", have_en, "picked:", en_srt.name if en_srt else None)
          PY

      - name: Extract audio for Whisper (16k mono wav) [only if needed]
        if: steps.detect_subs.outputs.have_zh != 'true' || steps.detect_subs.outputs.have_en != 'true'
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -y -i out/input.mp4 -vn -ac 1 -ar 16000 -c:a pcm_s16le out/_whisper.wav

      - name: Make voice reference wav (for cloning)
        shell: bash
        env:
          REF_SEC: ${{ inputs.tts_ref_seconds }}
        run: |
          set -euo pipefail
          ffmpeg -y -ss 1 -t "$REF_SEC" -i out/input.mp4 -vn -ac 1 -ar 24000 -c:a pcm_s16le out/_ref.wav
          test -s out/_ref.wav

      - name: Whisper transcribe Chinese (fallback)
        if: steps.detect_subs.outputs.have_zh != 'true'
        shell: bash
        env:
          WHISPER_MODEL: ${{ inputs.whisper_model }}
        run: |
          set -euo pipefail

          rm -rf out/_whisper_zh
          mkdir -p out/_whisper_zh

          whisper out/_whisper.wav \
            --model "$WHISPER_MODEL" \
            --task transcribe \
            --language Chinese \
            --output_dir out/_whisper_zh \
            --output_format all \
            --fp16 False

          test -s out/_whisper_zh/_whisper.srt
          test -s out/_whisper_zh/_whisper.txt
          cp out/_whisper_zh/_whisper.srt out/sub_zh.srt
          cp out/_whisper_zh/_whisper.txt out/transcript_zh.txt

      - name: Whisper translate to English (fallback)
        if: steps.detect_subs.outputs.have_en != 'true'
        shell: bash
        env:
          WHISPER_MODEL: ${{ inputs.whisper_model }}
        run: |
          set -euo pipefail

          rm -rf out/_whisper_en
          mkdir -p out/_whisper_en

          whisper out/_whisper.wav \
            --model "$WHISPER_MODEL" \
            --task translate \
            --language Chinese \
            --output_dir out/_whisper_en \
            --output_format all \
            --fp16 False

          test -s out/_whisper_en/_whisper.srt
          test -s out/_whisper_en/_whisper.txt
          cp out/_whisper_en/_whisper.srt out/sub_en.srt
          cp out/_whisper_en/_whisper.txt out/transcript_en.txt

      - name: Ensure English subtitle exists (sanity check)
        shell: bash
        run: |
          set -euo pipefail
          test -s out/sub_en.srt
          test -s out/transcript_en.txt

      - name: XTTS v2 voice-clone English audio (wav)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from TTS.api import TTS

          text = Path("out/transcript_en.txt").read_text(encoding="utf-8").strip()
          if not text:
              raise SystemExit("Empty English transcript")

          tts = TTS("tts_models/multilingual/multi-dataset/xtts_v2", gpu=False)
          tts.tts_to_file(
              text=text,
              speaker_wav="out/_ref.wav",
              language="en",
              file_path="out/_en_cloned.wav",
              split_sentences=True,
          )
          print("Generated out/_en_cloned.wav")
          PY

      - name: Mux into MP4 (English audio + English subtitles)
        shell: bash
        env:
          BURN_SUBS: ${{ inputs.burn_subs }}
        run: |
          set -euo pipefail

          if [ "$BURN_SUBS" = "yes" ]; then
            # Burn subtitles into the video frames (hard-sub)
            ffmpeg -y \
              -i out/input.mp4 -i out/_en_cloned.wav \
              -vf "subtitles=out/sub_en.srt" \
              -map 0:v:0 -map 1:a:0 \
              -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p \
              -c:a aac -b:a 192k \
              -shortest -movflags +faststart \
              out/output_en.mp4
          else
            # Embed subtitles as a selectable track in MP4 (soft-sub).
            # Note: MP4 typically uses mov_text for subtitles.
            ffmpeg -y \
              -i out/input.mp4 -i out/_en_cloned.wav \
              -sub_charenc UTF-8 -i out/sub_en.srt \
              -map 0:v:0 -map 1:a:0 -map 2:0 \
              -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p \
              -c:a aac -b:a 192k \
              -c:s mov_text -metadata:s:s:0 language=eng \
              -shortest -movflags +faststart \
              out/output_en.mp4
          fi

          test -s out/output_en.mp4

      - name: Cleanup (keep videos + subtitles + transcripts)
        shell: bash
        run: |
          set -euo pipefail

          # Keep:
          # - input.mp4, output_en.mp4
          # - sub_zh.srt, sub_en.srt
          # - transcript_zh.txt, transcript_en.txt
          find out -type f \
            ! -name "input.mp4" \
            ! -name "output_en.mp4" \
            ! -name "sub_zh.srt" \
            ! -name "sub_en.srt" \
            ! -name "transcript_zh.txt" \
            ! -name "transcript_en.txt" \
            -delete

          ls -lah out

      - name: Upload artifact (videos + subtitles + transcripts)
        uses: actions/upload-artifact@v4
        with:
          name: en-dubbed-output
          path: |
            out/input.mp4
            out/output_en.mp4
            out/sub_zh.srt
            out/sub_en.srt
            out/transcript_zh.txt
            out/transcript_en.txt
          retention-days: ${{ inputs.retention_days }}
