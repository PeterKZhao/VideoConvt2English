name: CN video -> EN dubbed video (voice clone, artifact)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Video URL to download (e.g., YouTube)"
        required: true
      whisper_model:
        description: "Whisper model: tiny/base/small/medium/large"
        required: false
        default: "small"
      tts_ref_seconds:
        description: "Seconds used as voice reference (>=6 recommended)"
        required: false
        default: "12"
      tts_voice_clone_lang:
        description: "Target language for cloned speech"
        required: false
        default: "en"
      retention_days:
        description: "Artifact retention days (1-90)"
        required: false
        default: "7"

permissions:
  contents: read

jobs:
  dub:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (yt-dlp JS runtime)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          # yt-dlp + ejs for YouTube, whisper for translate, TTS for XTTS v2 voice cloning
          pip install yt-dlp yt-dlp-ejs openai-whisper TTS

      - name: Prepare workspace
        run: |
          rm -rf out
          mkdir -p out

      - name: Write cookies.txt (optional)
        shell: bash
        env:
          YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
        run: |
          python - <<'PY'
          import os, pathlib
          content = os.environ.get("YTDLP_COOKIES", "")
          if content.strip():
            pathlib.Path("cookies.txt").write_text(content, encoding="utf-8", newline="\n")
            print("cookies.txt written")
          else:
            print("No cookies secret provided; skipping cookies.txt")
          PY

      - name: Download video (yt-dlp)
        shell: bash
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          set -euo pipefail
          EXTRA_ARGS=()
          if [ -f cookies.txt ]; then
            EXTRA_ARGS+=(--cookies cookies.txt)
          fi
          EXTRA_ARGS+=(--js-runtimes node)
          EXTRA_ARGS+=(--remote-components ejs:github)

          # Prefer H.264 in MP4 when available, fallback to best MP4
          FORMAT_SELECTOR='bv*[vcodec^=avc1][ext=mp4]+ba[ext=m4a]/b[ext=mp4]/best'

          yt-dlp \
            "${EXTRA_ARGS[@]}" \
            --no-playlist \
            -f "$FORMAT_SELECTOR" \
            --merge-output-format mp4 \
            -o "out/input.%(ext)s" \
            "$VIDEO_URL"

          ls -lah out

      - name: Extract full audio for Whisper (16k mono wav)
        shell: bash
        run: |
          set -euo pipefail
          VIDEO_FILE="$(ls -1 out/input.* | head -n 1)"
          ffmpeg -y -i "$VIDEO_FILE" -vn -ac 1 -ar 16000 -c:a pcm_s16le out/audio_whisper.wav

      - name: Make voice reference wav (for cloning)
        shell: bash
        env:
          REF_SEC: ${{ inputs.tts_ref_seconds }}
        run: |
          set -euo pipefail
          VIDEO_FILE="$(ls -1 out/input.* | head -n 1)"
          # Take a short slice after 1s to avoid leading silence; 24kHz mono is fine for XTTS
          ffmpeg -y -ss 1 -t "$REF_SEC" -i "$VIDEO_FILE" -vn -ac 1 -ar 24000 -c:a pcm_s16le out/ref.wav

      - name: Whisper translate to English text (txt)
        shell: bash
        env:
          WHISPER_MODEL: ${{ inputs.whisper_model }}
        run: |
          set -euo pipefail
          whisper out/audio_whisper.wav \
            --model "$WHISPER_MODEL" \
            --task translate \
            --language Chinese \
            --output_dir out \
            --output_format txt

          test -s out/audio_whisper.txt

      - name: XTTS v2 voice-clone English audio (wav)
        shell: bash
        env:
          TARGET_LANG: ${{ inputs.tts_voice_clone_lang }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from TTS.api import TTS

          text = Path("out/audio_whisper.txt").read_text(encoding="utf-8").strip()
          if not text:
              raise SystemExit("Empty transcript")

          # XTTS v2: cross-language voice cloning via speaker_wav
          tts = TTS("tts_models/multilingual/multi-dataset/xtts_v2", gpu=False)

          tts.tts_to_file(
              text=text,
              speaker_wav="out/ref.wav",
              language=os.environ.get("TARGET_LANG", "en"),
              file_path="out/en_cloned.wav",
              split_sentences=True,
          )
          print("Generated out/en_cloned.wav")
          PY

      - name: Mux back into MP4 (Windows compatible)
        shell: bash
        run: |
          set -euo pipefail
          VIDEO_FILE="$(ls -1 out/input.* | head -n 1)"

          # Always re-encode video to H.264 for Windows stock player compatibility
          ffmpeg -y \
            -i "$VIDEO_FILE" -i out/en_cloned.wav \
            -map 0:v:0 -map 1:a:0 \
            -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p \
            -c:a aac -b:a 192k \
            -shortest -movflags +faststart \
            out/output_en.mp4

      - name: Cleanup (keep only input.mp4 and output_en.mp4)
        shell: bash
        run: |
          set -euo pipefail
          # Normalize original name to input.mp4 (in case it isn't)
          IN="$(ls -1 out/input.* | head -n 1)"
          if [ "$IN" != "out/input.mp4" ]; then
            mv "$IN" out/input.mp4
          fi
          # Remove everything else
          find out -type f ! -name "input.mp4" ! -name "output_en.mp4" -delete
          ls -lah out

      - name: Upload artifact (only the two videos)
        uses: actions/upload-artifact@v4
        with:
          name: en-dubbed-output
          path: |
            out/input.mp4
            out/output_en.mp4
          retention-days: ${{ inputs.retention_days }}
