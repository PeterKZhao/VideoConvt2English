name: CN video -> EN dubbed video (artifact)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Video URL to download"
        required: true
      whisper_model:
        description: "Whisper model (tiny/base/small/medium/large)"
        required: false
        default: "small"
      tts_voice:
        description: "edge-tts voice"
        required: false
        default: "en-US-JennyNeural"

jobs:
  dub:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp openai-whisper edge-tts

      - name: Run pipeline
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          WHISPER_MODEL: ${{ inputs.whisper_model }}
          TTS_VOICE: ${{ inputs.tts_voice }}
        run: |
          bash scripts/run.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: en-dubbed-output
          path: out/
          retention-days: 7
