name: Secret migration audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Audit secret metadata
        shell: bash
        env:
          YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
          YOUTUBE_SOURCE_COOKIE_FILE_VIDEO_DUB: ${{ secrets.YOUTUBE_SOURCE_COOKIE_FILE_VIDEO_DUB }}
          COQUI_TOS_AGREED: ${{ secrets.COQUI_TOS_AGREED }}
        run: |
          set -euo pipefail

          audit() {
            local name="$1"
            local value="$2"
            if [[ -z "$value" ]]; then
              echo "$name present=false"
              return
            fi

            local bytes digest valid
            bytes="$(printf '%s' "$value" | wc -c | tr -d ' ')"
            digest="$(printf '%s' "$value" | sha256sum | cut -c1-16)"
            valid=false
            if [[ "$value" == *$'\t'* ]]; then
              valid=true
            fi
            echo "$name present=true bytes=$bytes sha256_16=$digest format=netscape valid=$valid"
          }

          audit YTDLP_COOKIES "${YTDLP_COOKIES:-}"
          audit YOUTUBE_SOURCE_COOKIE_FILE_VIDEO_DUB "${YOUTUBE_SOURCE_COOKIE_FILE_VIDEO_DUB:-}"

          [[ "$YTDLP_COOKIES" == "$YOUTUBE_SOURCE_COOKIE_FILE_VIDEO_DUB" ]] && echo "youtube_migration_match=true" || echo "youtube_migration_match=false"

          if [[ -n "${COQUI_TOS_AGREED:-}" ]]; then
            echo "COQUI_TOS_AGREED present=true"
          else
            echo "COQUI_TOS_AGREED present=false"
          fi
