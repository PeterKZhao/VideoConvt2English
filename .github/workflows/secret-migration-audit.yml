name: Secret migration audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Audit secret metadata
        shell: bash
        env:
          YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
          COQUI_TOS_AGREED: ${{ secrets.COQUI_TOS_AGREED }}
        run: |
          set -euo pipefail

          value="${YTDLP_COOKIES:-}"
          if [[ -z "$value" ]]; then
            echo "YTDLP_COOKIES present=false"
          else
            bytes="$(printf '%s' "$value" | wc -c | tr -d ' ')"
            digest="$(printf '%s' "$value" | sha256sum | cut -c1-16)"
            valid=false
            if [[ "$value" == *$'\t'* ]]; then
              valid=true
            fi
            echo "YTDLP_COOKIES present=true bytes=$bytes sha256_16=$digest format=netscape valid=$valid"
          fi

          if [[ -n "${COQUI_TOS_AGREED:-}" ]]; then
            echo "COQUI_TOS_AGREED present=true"
          else
            echo "COQUI_TOS_AGREED present=false"
          fi
